<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: color-mix(in srgb, currentColor 18%, transparent);
        --soft: color-mix(in srgb, currentColor 7%, transparent);
        --muted: color-mix(in srgb, currentColor 60%, transparent);
        --accent: #3b6fd8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      /* Tyto paints white behind every panel page, in both themes, and hands it no theme
         colours. "light dark" makes this page's scheme the window's (Electron answers
         prefers-color-scheme from the theme setting), so in the dark theme the page's own
         text is light: the page must paint the background that text was chosen for.
         Canvas and CanvasText are the scheme's pair, so the two always go together. */
      body {
        background: Canvas;
        color: CanvasText;
        display: flex;
        flex-direction: column;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
      }
      header strong {
        flex: 1;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .message {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 6px 8px;
        border-radius: 6px;
      }
      .user {
        align-self: flex-end;
        max-width: 85%;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .agent {
        background: var(--soft);
      }
      /* The markdown panel.js builds, in agent messages and problem boxes. */
      .agent p,
      .problem p {
        margin: 0 0 6px;
      }
      .agent > :last-child,
      .problem .said > :last-child {
        margin-bottom: 0;
      }
      .heading {
        font-weight: 600;
      }
      .heading.level-1,
      .heading.level-2 {
        font-size: 14px;
      }
      .agent ul,
      .agent ol {
        margin: 0 0 6px;
        padding-left: 20px;
        white-space: normal;
      }
      .agent li {
        white-space: pre-wrap;
      }
      .agent blockquote {
        margin: 0 0 6px;
        padding-left: 8px;
        border-left: 3px solid var(--line);
        color: var(--muted);
      }
      .agent code,
      .problem .said code {
        font:
          12px ui-monospace,
          Consolas,
          monospace;
        padding: 0 3px;
        border-radius: 3px;
        background: var(--soft);
      }
      .problem .said code {
        display: inline;
        margin: 0;
        user-select: text;
      }
      .agent pre {
        margin: 0 0 6px;
        padding: 6px 8px;
        overflow-x: auto;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: Canvas;
      }
      .agent pre code {
        display: block;
        padding: 0;
        background: none;
        white-space: pre;
      }
      .agent .added {
        color: light-dark(#116329, #7ee787);
      }
      .agent .removed {
        color: light-dark(#b42318, #ff9a8f);
      }
      .agent .hunk,
      .agent .address {
        color: var(--muted);
      }
      .earlier {
        opacity: 0.7;
      }
      .meta,
      .thought,
      .tool,
      .notice {
        font-size: 12px;
        color: var(--muted);
      }
      .thought {
        font-style: italic;
        white-space: pre-wrap;
      }
      .problem,
      .permission {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
      }
      .problem code {
        display: block;
        margin-top: 4px;
        padding: 4px 6px;
        background: var(--soft);
        border-radius: 4px;
        user-select: all;
      }
      .permission .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      footer {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px;
        border-top: 1px solid var(--line);
      }
      .compose {
        display: flex;
        gap: 6px;
      }
      .compose button {
        min-width: 64px;
      }
      #working {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      #working[hidden] {
        display: none;
      }
      .dots {
        display: inline-flex;
        gap: 3px;
      }
      .dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.2s infinite ease-in-out;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      .chip {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        align-self: flex-start;
        max-width: 100%;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        background: var(--soft);
        color: var(--muted);
      }
      .context-brief {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: CanvasText;
      }
      .context-brief.empty {
        color: var(--muted);
        font-style: italic;
      }
      .context-reach {
        color: light-dark(#b42318, #ff9a8f);
      }
      button.stop {
        border-color: light-dark(#b42318, #ff9a8f);
        color: light-dark(#b42318, #ff9a8f);
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 54px;
        font: inherit;
        padding: 6px;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      button {
        font: inherit;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--soft);
        color: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <strong id="agent">Agent</strong>
      <button id="reset">New</button>
    </header>
    <main id="log" aria-live="polite"></main>
    <footer>
      <div id="working" role="status" hidden>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="working-text"></span>
      </div>
      <div id="context" class="chip"></div>
      <div class="compose">
        <textarea id="input"></textarea>
        <button id="send" class="primary">Send</button>
        <button id="stop" class="stop" hidden>Stop</button>
      </div>
    </footer>
    <script src="words.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
