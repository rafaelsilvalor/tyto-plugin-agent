<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: color-mix(in srgb, currentColor 18%, transparent);
        --soft: color-mix(in srgb, currentColor 7%, transparent);
        --muted: color-mix(in srgb, currentColor 60%, transparent);
        --accent: #3b6fd8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
      }
      header strong {
        flex: 1;
      }
      .badge {
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 8px;
        background: var(--soft);
        color: var(--muted);
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .message {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 6px 8px;
        border-radius: 6px;
      }
      .user {
        align-self: flex-end;
        max-width: 85%;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .agent {
        background: var(--soft);
      }
      .earlier {
        opacity: 0.7;
      }
      .meta,
      .thought,
      .tool,
      .notice {
        font-size: 12px;
        color: var(--muted);
      }
      .thought {
        font-style: italic;
        white-space: pre-wrap;
      }
      .problem,
      .permission {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
      }
      .problem code {
        display: block;
        margin-top: 4px;
        padding: 4px 6px;
        background: var(--soft);
        border-radius: 4px;
        user-select: all;
      }
      .permission .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      footer {
        display: flex;
        gap: 6px;
        padding: 8px 10px;
        border-top: 1px solid var(--line);
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 54px;
        font: inherit;
        padding: 6px;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      button {
        font: inherit;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--soft);
        color: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <strong id="agent">Agent</strong>
      <span id="window" class="badge" title="Whether the agent sees the window">window: …</span>
      <button id="reset" title="End this conversation and start a new one">New</button>
    </header>
    <main id="log" aria-live="polite"></main>
    <footer>
      <textarea id="input" placeholder="Ask the agent… (Ctrl+Enter sends)"></textarea>
      <button id="send" class="primary">Send</button>
      <button id="stop" hidden>Stop</button>
    </footer>
    <script src="panel.js"></script>
  </body>
</html>
